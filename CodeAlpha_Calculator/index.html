<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, modern, and responsive Calculator web application built with vanilla HTML5, CSS3, and JavaScript.">
  <title>Calculator | Modern & Responsive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <header class="calc-header">
      <h1 class="calc-title">Calculator</h1>
    </header>

    <main class="calculator" id="calculator" role="region" aria-label="Standard Calculator">
      <div class="calc-display" id="display" role="status" aria-live="polite">
        <div class="previous-operand" id="previous-operand" aria-label="Previous operation"></div>
        <div class="current-operand" id="current-operand" aria-label="Current value">0</div>
      </div>

      <div class="keypad" role="group" aria-label="Calculator Keypad">
        <button type="button" class="btn btn-function btn-clear" id="btn-clear" data-action="clear" data-key="Escape" aria-label="Clear All">AC</button>
        <button type="button" class="btn btn-function btn-delete" id="btn-delete" data-action="delete" data-key="Backspace" aria-label="Delete last digit">DEL</button>
        <button type="button" class="btn btn-function" id="btn-percent" data-action="percent" data-key="%" aria-label="Percent">%</button>
        <button type="button" class="btn btn-operator" data-operation="÷" data-key="/" aria-label="Divide">÷</button>

        <button type="button" class="btn btn-number" data-number="7" data-key="7" aria-label="7">7</button>
        <button type="button" class="btn btn-number" data-number="8" data-key="8" aria-label="8">8</button>
        <button type="button" class="btn btn-number" data-number="9" data-key="9" aria-label="9">9</button>
        <button type="button" class="btn btn-operator" data-operation="×" data-key="*" aria-label="Multiply">×</button>

        <button type="button" class="btn btn-number" data-number="4" data-key="4" aria-label="4">4</button>
        <button type="button" class="btn btn-number" data-number="5" data-key="5" aria-label="5">5</button>
        <button type="button" class="btn btn-number" data-number="6" data-key="6" aria-label="6">6</button>
        <button type="button" class="btn btn-operator" data-operation="−" data-key="-" aria-label="Subtract">−</button>

        <button type="button" class="btn btn-number" data-number="1" data-key="1" aria-label="1">1</button>
        <button type="button" class="btn btn-number" data-number="2" data-key="2" aria-label="2">2</button>
        <button type="button" class="btn btn-number" data-number="3" data-key="3" aria-label="3">3</button>
        <button type="button" class="btn btn-operator" data-operation="+" data-key="+" aria-label="Add">+</button>

        <button type="button" class="btn btn-function" id="btn-negate" data-action="negate" data-key="±" aria-label="Toggle positive or negative">±</button>
        <button type="button" class="btn btn-number" data-number="0" data-key="0" aria-label="0">0</button>
        <button type="button" class="btn btn-number" data-number="." data-key="." aria-label="Decimal point">.</button>
        <button type="button" class="btn btn-equals" id="btn-equals" data-action="equals" data-key="Enter" aria-label="Equals">=</button>
      </div>
    </main>


  </div>

  <script src="script.js"></script>
</body>
</html>
